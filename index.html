<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Paper Reader" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <title>Paper Reader</title>
  <style>
    :root{
      --bg:#f3f3f1;--surface:rgba(255,255,255,.88);--surface-solid:#fff;--text:#111;
      --muted:#777;--line:rgba(0,0,0,.09);--soft:rgba(0,0,0,.045);--accent:#111;
      --shadow:0 14px 44px rgba(0,0,0,.10);--radius:14px
    }
    html[data-theme="dark"]{
      --bg:#161616;--surface:rgba(28,28,28,.90);--surface-solid:#202020;--text:#f5f5f5;
      --muted:#999;--line:rgba(255,255,255,.09);--soft:rgba(255,255,255,.055);--accent:#f5f5f5;
      --shadow:0 18px 55px rgba(0,0,0,.34)
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
    body{overflow:hidden}
    button,input,select{font:inherit;color:inherit}button{touch-action:manipulation}
    .progress{position:fixed;z-index:100;top:0;left:0;right:0;height:2px;background:transparent}.progress>div{height:100%;width:0;background:var(--text);transition:width .2s ease}
    .app{height:100dvh;display:grid;grid-template-columns:282px minmax(0,1fr);overflow:hidden}
    .sidebar{background:var(--surface-solid);border-right:1px solid var(--line);padding:22px 16px;overflow:auto}
    .brand{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 4px 8px}.brand h1{font-size:18px;letter-spacing:-.02em;margin:0;font-weight:650}.brand small{display:block;color:var(--muted);margin-top:3px;font-size:12px}
    .section{margin-top:24px}.label{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin:0 8px 8px;font-weight:650}
    .btn,.file-label,.field,.book,.bookmark{border:0;background:transparent;border-radius:10px}
    .btn{min-height:40px;padding:8px 11px;cursor:pointer}.btn:hover{background:var(--soft)}.btn.icon{width:40px;padding:0;display:grid;place-items:center;font-size:16px}.btn:disabled{opacity:.28}
    .file-label{display:grid;place-items:center;min-height:44px;background:var(--text);color:var(--surface-solid);font-size:14px;font-weight:650;cursor:pointer;transition:transform .15s ease,opacity .15s}.file-label:active{transform:scale(.985);opacity:.85}.file-input{display:none}
    .field{width:100%;min-height:40px;padding:8px 11px;background:var(--soft);outline:none}.field:focus{box-shadow:0 0 0 1px var(--line) inset}
    .library,.bookmark-list{display:grid;gap:2px}.book,.bookmark{padding:10px 9px;text-align:left;cursor:pointer;transition:background .14s}.book:hover,.bookmark:hover{background:var(--soft)}.book strong,.bookmark strong{display:block;font-size:13px;font-weight:590;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.book small,.bookmark small{display:block;color:var(--muted);margin-top:3px;font-size:11px}.book.active{background:var(--soft)}
    .main{min-width:0;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;position:relative}
    .toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--line);z-index:20;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
    .toolbar .grow{flex:1;min-width:0}.title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:620;letter-spacing:-.01em}.subtitle{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .searchbox{display:flex;gap:4px;align-items:center}.searchbox input{width:min(260px,31vw);border-radius:9px}.searchbox .btn{font-size:13px}
    .viewer{overflow:auto;-webkit-overflow-scrolling:touch;display:grid;place-items:start center;padding:30px 28px 110px;background:var(--bg)}
    .canvas-wrap{position:relative;background:#fff;box-shadow:var(--shadow);margin:auto;border-radius:3px;overflow:hidden}.canvas-wrap canvas{display:block;max-width:none}.textLayer{position:absolute;inset:0;overflow:hidden;opacity:.01;line-height:1}.textLayer span{color:transparent;position:absolute;white-space:pre;transform-origin:0 0;cursor:text}.textLayer ::selection{background:rgba(80,120,255,.4)}
    .empty{align-self:center;justify-self:center;text-align:center;max-width:520px;padding:48px}.empty h2{font-size:clamp(30px,5vw,48px);letter-spacing:-.04em;line-height:1.02;margin:0 0 14px;font-weight:680}.empty p{color:var(--muted);line-height:1.55;font-size:14px;margin:0 auto 24px;max-width:430px}.empty .file-label{display:inline-grid;width:auto;padding:0 18px}
    .footer{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:5px;padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);z-index:25}
    .footer .center{color:var(--muted);font-size:12px;text-align:center;min-width:112px;padding:0 6px}.footer .left,.footer .right{display:flex;gap:2px}.footer .right{justify-self:auto}.footer .btn{min-height:36px;border-radius:9px;font-size:13px;padding:6px 10px}.footer .left .btn{width:36px;padding:0}
    .toast{position:fixed;z-index:100;left:50%;bottom:84px;transform:translate(-50%,10px);background:var(--surface-solid);border:1px solid var(--line);border-radius:11px;padding:9px 13px;box-shadow:var(--shadow);opacity:0;transition:.2s;pointer-events:none;font-size:13px}.toast.show{opacity:1;transform:translate(-50%,0)}
    .loader{position:fixed;z-index:110;inset:0;display:none;place-items:center;background:rgba(0,0,0,.25);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}.loader.show{display:grid}.loader-card{min-width:240px;max-width:80vw;background:var(--surface-solid);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);text-align:center}.loader-card strong{font-size:14px}.loader-card p{color:var(--muted);font-size:12px;margin:7px 0 0}
    .drawer-toggle{display:none}
    select.field{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 17px,calc(100% - 12px) 17px;background-size:4px 4px,4px 4px;background-repeat:no-repeat;padding-right:28px}
    @media(max-width:900px){
      .app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:60;inset:0 auto 0 0;width:min(82vw,300px);transform:translateX(-102%);transition:.22s ease;box-shadow:var(--shadow);padding-top:max(22px,env(safe-area-inset-top))}body.sidebar-open .sidebar{transform:none}body.sidebar-open:after{content:"";position:fixed;z-index:50;inset:0;background:rgba(0,0,0,.28);backdrop-filter:blur(2px)}.drawer-toggle{display:grid}.searchbox input{width:180px}.viewer{padding:22px 12px 104px}.toolbar{padding-top:max(10px,env(safe-area-inset-top))}
    }
    @media(max-width:650px){.searchbox{display:none}.toolbar{gap:4px}.viewer{padding-inline:6px}.footer .center{min-width:92px}.footer{max-width:calc(100vw - 14px)}.footer .btn{padding-inline:8px}}
  </style>
</head>
<body>
<div class="progress"><div id="progressBar"></div></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div><h1>Paper</h1><small>Reader</small></div><button class="btn icon" id="closeSidebar">✕</button></div>
    <div class="section"><label class="file-label" for="fileInput">Añadir PDF</label><input class="file-input" id="fileInput" type="file" accept="application/pdf,.pdf" /></div>
    <div class="section"><div class="label">Biblioteca</div><div class="library" id="library"></div></div>
    <div class="section"><div class="label">Marcadores</div><div class="bookmark-list" id="bookmarkList"></div></div>
    <div class="section"><div class="label">Apariencia</div><select class="field" id="themeSelect"><option value="dark">Oscuro</option><option value="light">Claro</option></select></div>
  </aside>

  <main class="main">
    <header class="toolbar">
      <button class="btn icon drawer-toggle" id="openSidebar">☰</button>
      <div class="grow"><div class="title" id="docTitle">Paper Reader</div><div class="subtitle" id="docMeta">Tus documentos se quedan en este dispositivo</div></div>
      <div class="searchbox"><input class="field" id="searchInput" placeholder="Buscar en el paper…"/><button class="btn" id="searchBtn">Buscar</button></div>
      <button class="btn icon" id="bookmarkBtn" title="Marcar página">🔖</button>
    </header>

    <section class="viewer" id="viewer">
      <div class="empty" id="emptyState"><h2>Lee. Marca. Continúa.</h2><p>Tus papers se guardan en este dispositivo y mantienen su diseño original.</p><label class="file-label" for="fileInput">Abrir PDF</label></div>
      <div class="canvas-wrap" id="canvasWrap" hidden><canvas id="pdfCanvas"></canvas><div class="textLayer" id="textLayer"></div></div>
    </section>

    <footer class="footer">
      <div class="left"><button class="btn" id="prevBtn">←</button><button class="btn" id="nextBtn">→</button></div>
      <div class="center"><span id="pageStatus">Sin documento</span></div>
      <div class="right"><button class="btn" id="zoomOut">−</button><button class="btn" id="fitBtn">Ajustar</button><button class="btn" id="zoomIn">＋</button></div>
    </footer>
  </main>
</div>
<div class="loader" id="loader"><div class="loader-card"><strong id="loaderTitle">Abriendo PDF…</strong><p id="loaderText">Preparando documento</p></div></div>
<div class="toast" id="toast"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
